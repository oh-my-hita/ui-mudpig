pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven {
            url = uri(providers.gradleProperty("pluginSdkRepo").getOrElse(
                "https://raw.githubusercontent.com/oh-my-hita/plugin-sdk/master/maven"
            ))
        }
    }
}
rootProject.name = "hita-plugin-mudpig"
include ':ui-plugin'
